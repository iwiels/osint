appId: io.wraith.osint
productName: WraithOSINT
copyright: MIT

# La app no tiene dependencias nativas: el renderer va empaquetado con Vite y el proceso
# principal solo usa Electron y Node. Con workspaces de npm no existe desktop/node_modules
# y electron-builder reaccionaba ejecutando `npm install --production` ahí, lo que poda las
# devDependencies de la raíz, electron-builder incluido: el empaquetado moría con
# «spawn app-builder ENOENT». Sin reconstrucción no hay instalación.
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# El binario del motor lo produce scripts/build-engine.py (PyInstaller onefile)
# en dist-engine/. El nombre cambia por plataforma: .exe solo en Windows.
extraResources:
  - from: ../dist-engine/
    to: engine/
    filter:
      - "wraith-engine"
      - "wraith-engine.exe"

# ------------------------------------------------------------------
# Arquitecturas: NO se fijan aquí a propósito.
#
# El motor viaja dentro de la app y PyInstaller no cross-compila, así que la
# arquitectura del instalador TIENE que ser la del binario que hay en
# dist-engine/. Al dejar que electron-builder use la arquitectura del host
# (o la que pase la CI con --x64 / --arm64), el paquete y su motor siempre
# coinciden. Fijarlas aquí producía un .dmg x64 con un motor arm64 dentro.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# Windows: instalador NSIS por-usuario (no requiere admin)
# ------------------------------------------------------------------
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}-setup.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WraithOSINT

# ------------------------------------------------------------------
# macOS: DMG + ZIP. Sin firma ni notarización configuradas todavía: el
# usuario tendrá que permitir la app en Ajustes → Privacidad y seguridad.
# Para distribución sin fricción hay que añadir certificado Developer ID
# y notarización (no incluido aquí).
# ------------------------------------------------------------------
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # hardenedRuntime y entitlements se activan al añadir firma real.
  identity: null

# ------------------------------------------------------------------
# Linux: AppImage (portable) + .deb
# ------------------------------------------------------------------
linux:
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish: null
