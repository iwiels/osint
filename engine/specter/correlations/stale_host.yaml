id: stale_host
version: 1
meta:
  name: "Stale or unmaintained host"
  description: >
    A host appears to be stale based upon various indicators such as unsuccessful
    HTTP codes, expired SSL certificates, error messages, vulnerabilities and
    junk files found. Such hosts may be unmaintained, exposing the target to
    security risks.
  risk: HIGH
collections:
  - collect:
      - method: regex
        field: type
        value: "SSL_CERTIFICATE_EXPIRED"
  - collect:
      - method: regex
        field: type
        value: "HTTP_CODE"
      - method: regex
        field: data
        value: "not ^[2-3].*$"
  - collect:
      - method: regex
        field: type
        value: "ERROR_MESSAGE"
  - collect:
      - method: regex
        field: type
        value: "VULNERABILITY_*"
aggregation:
  field: data
analysis:
  - method: threshold
    field: type
    count_unique_only: true
    minimum: 3
headline: "Potentially stale/unmaintained host: {data}"
