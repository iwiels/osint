id: dev_or_test_system
version: 1
meta:
  name: "Development or test system exposed"
  description: >
    A host that has dev, test, staging, internal or uat in its name was found.
    This may indicate a system that is exposed over the Internet unintentionally,
    and/or may be less secure than other systems. Development systems often have
    weaker security controls and may contain sensitive data or credentials.
  risk: MEDIUM
collections:
  - collect:
      - method: exact
        field: type
        value: SUBDOMAIN
      - method: regex
        field: data
        value:
          - ".*dev.*"
          - ".*test.*"
          - ".*uat.*"
          - ".*internal.*"
          - ".*staging.*"
aggregation:
  field: data
headline: "Development or internal system found: {data}"
