name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela builds obsoletos de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: la CI solo lee el repositorio.
permissions:
  contents: read

jobs:
  engine:
    name: Motor (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 es el suelo que declara pyproject.toml; 3.12 es la versión con la
        # que se compilan los binarios de release. Se verifican ambas para que
        # el rango soportado no sea una promesa sin comprobar.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Instalar dependencias del motor
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt pytest pytest-cov ruff

      - name: Lint (ruff check + format)
        # Mismo par que `npm run lint`: si el formato deriva, la CI lo ve.
        run: |
          ruff check engine/ tests/
          ruff format --check engine/ tests/

      - name: Tests + coverage gate (80%)
        # pyproject define pythonpath=[engine] y --cov-fail-under=80
        run: python -m pytest tests/ -q

      - name: Contrato motor<->SDK (gen:sdk:check)
        # El gate que hace ruidosa la deriva del contrato: levanta un engine
        # efímero y compara /openapi.json contra packages/sdk/src/generated.ts.
        run: python scripts/gen_sdk_types.py --check

  web:
    name: SDK + Desktop (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias JS
        # `npm ci` exige que package-lock.json esté sincronizado con los
        # package.json: si alguien añade una dependencia y olvida el lock, la CI
        # falla aquí en vez de resolver versiones distintas a las del resto.
        run: npm ci --no-audit --no-fund
        env:
          SPECTER_SKIP_ENGINE_SETUP: "1" # el motor tiene su propio job

      - name: Typecheck
        run: npm run typecheck

      - name: Contraste WCAG AA (a11y:contrast)
        # Gate de accesibilidad del design system: sin dependencias, solo Node.
        run: npm run a11y:contrast

      - name: Tests del SDK + coverage gate
        run: npm test

      - name: Tests del renderer desktop
        run: npm run test:desktop

      - name: Build de producción del desktop
        run: npm run build
