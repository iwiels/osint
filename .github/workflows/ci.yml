name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela builds obsoletos de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine deps
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt pytest pytest-cov ruff

      - name: Lint (ruff check + format)
        # Mismo par que `npm run lint`: si el formato deriva, la CI lo ve.
        run: |
          ruff check engine/ tests/
          ruff format --check engine/ tests/

      - name: Tests + coverage gate (80%)
        # pyproject define pythonpath=[engine] y --cov-fail-under=80
        run: python -m pytest tests/ -q

      - name: Contrato motor<->SDK (gen:sdk:check)
        # El gate que hace ruidosa la deriva del contrato: levanta un engine
        # efímero y compara /openapi.json contra packages/sdk/src/generated.ts.
        run: python scripts/gen_sdk_types.py --check

  web:
    name: SDK + Desktop (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS deps
        run: npm install --no-audit --no-fund
        env:
          SPECTER_SKIP_ENGINE_SETUP: "1" # el engine tiene su propio job

      - name: Typecheck
        run: npm run typecheck

      - name: Contraste WCAG AA (a11y:contrast)
        # Gate de accesibilidad del design system: sin dependencias, solo Node.
        run: npm run a11y:contrast

      - name: SDK tests + coverage gate
        run: npm test

      - name: Desktop build
        run: npm run build
