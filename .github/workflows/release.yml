name: Release

# Empaqueta los instaladores de las tres plataformas al crear un tag vX.Y.Z.
# Artefactos publicados:
#   Windows → WraithOSINT-<ver>-win-x64-setup.exe
#   macOS   → WraithOSINT-<ver>-mac-x64.dmg / .zip  y  ...-mac-arm64.dmg / .zip
#   Linux   → WraithOSINT-<ver>-linux-x64.AppImage / .deb
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # necesario para crear el GitHub Release con artifacts

jobs:
  # ------------------------------------------------------------------
  # El binario del motor se compila en cada plataforma y arquitectura:
  # PyInstaller NO cross-compila, así que cada runner produce su propio
  # ejecutable. macOS necesita dos (Intel y Apple Silicon) porque el motor
  # viaja dentro del .app y no puede ser de otra arquitectura que la app.
  #
  # NOTA sobre runners de macOS: `macos-latest` es Apple Silicon (arm64) y
  # `macos-15-intel` es Intel (x64). Si GitHub renombra la etiqueta Intel,
  # basta con actualizar (o borrar) esas dos entradas del matrix: el resto
  # del release sigue igual. Consulta la lista vigente en
  # https://docs.github.com/actions/using-github-hosted-runners
  # ------------------------------------------------------------------
  engine:
    name: Motor (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel # Intel → binario x64
            target: mac-x64
          - os: macos-latest # Apple Silicon → binario arm64
            target: mac-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Instalar dependencias + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt pyinstaller

      - name: Compilar binario del motor
        run: python scripts/build-engine.py

      - name: Smoke test del binario
        # Arranca el ejecutable recién compilado y comprueba /health, la autenticación
        # y un caso real: un motor roto no debe llegar nunca a un instalador.
        run: python scripts/smoke_engine_binary.py

      - name: Subir binario del motor
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          # El nombre real del binario es wraith-engine(.exe): si el script
          # cambia de nombre, esto falla en vez de publicar un instalador
          # sin motor dentro.
          path: dist-engine/wraith-engine*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Un job por plataforma y arquitectura: cada uno baja el motor que le
  # corresponde y empaqueta un único instalador con esa arquitectura.
  # ------------------------------------------------------------------
  desktop:
    name: Instalador (${{ matrix.target }})
    needs: engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            dist: --win --x64
          - os: ubuntu-latest
            target: linux-x64
            dist: --linux --x64
          - os: macos-15-intel
            target: mac-x64
            dist: --mac --x64
          - os: macos-latest
            target: mac-arm64
            dist: --mac --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Descargar el binario del motor
        uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: dist-engine

      - name: Instalar dependencias JS
        run: npm ci --no-audit --no-fund
        env:
          SPECTER_SKIP_ENGINE_SETUP: "1"

      - name: Build de producción del desktop
        run: npm run build

      - name: Empaquetar instalador
        run: npm run dist --workspace desktop -- ${{ matrix.dist }}
        env:
          # Electron-builder publica vía GitHub Releases con este token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          # Un instalador que no se generó es un release roto, no un aviso.
          if-no-files-found: error

  release:
    name: Publicar release
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Solo para leer .github/release-notes.md; los instaladores vienen de los artefactos.
      - uses: actions/checkout@v4

      - name: Descargar todos los instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WraithOSINT ${{ github.ref_name }}
          # El cuerpo propio (descargas, primer arranque, uso responsable) va delante de
          # las notas autogeneradas con los cambios desde el release anterior.
          body_path: .github/release-notes.md
          files: release-assets/*
          generate_release_notes: true
          draft: false
