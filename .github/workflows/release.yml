name: Release

# Empaqueta los instaladores de las tres plataformas al crear un tag vX.Y.Z.
# Artefactos por plataforma:
#   Windows → SpecterOSINT-<ver>-win-x64-setup.exe
#   macOS   → SpecterOSINT-<ver>-mac-<arch>.dmg / .zip
#   Linux   → SpecterOSINT-<ver>-linux-x64.AppImage / .deb
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # necesario para crear el GitHub Release con artifacts

jobs:
  # ------------------------------------------------------------------
  # El binario del motor se compila en cada plataforma: PyInstaller no
  # cross-compila, así que cada runner produce su propio ejecutable.
  # ------------------------------------------------------------------
  engine:
    name: Engine binario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt pyinstaller

      - name: Build engine executable
        run: python scripts/build-engine.py

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: specter-engine-${{ matrix.os }}
          path: dist-engine/specter-engine*

  desktop:
    name: Instalador (${{ matrix.os }})
    needs: engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: --win
          - os: macos-latest
            dist: --mac
          - os: ubuntu-latest
            dist: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Download engine binary
        uses: actions/download-artifact@v4
        with:
          name: specter-engine-${{ matrix.os }}
          path: dist-engine

      - name: Install JS deps
        run: npm install --no-audit --no-fund
        env:
          SPECTER_SKIP_ENGINE_SETUP: "1"

      - name: Build desktop app
        run: npm run build

      - name: Package installer
        run: npm run dist --workspace desktop -- ${{ matrix.dist }}
        env:
          # Sin token de publicación; artifacts solo al GitHub Release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: warn

  release:
    name: Publicar release
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
